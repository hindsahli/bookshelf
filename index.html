<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bookshelf</title>
    <meta
      name="description"
      content="bookshelf : organiser votre bibliotheque"
    />
    <link rel="stylesheet" href="css/output.css" />
  </head>

  <body class="bg-background-white">
    <header class="bg-white flex justify-between items-center px-20 py-6">
      <div>
        <p
          class="text-2xl font-bold font-serif text-dark-bleu text-center leading-none"
        >
          BookShelf
        </p>
        <p class="text-xs pt-1 text-center text-dark-bleu">
          My personal collection
        </p>
      </div>
      <div>
        <button
          class="text-center bg-dark-bleu text-white h-10 px-4 border rounded"
        >
          + Add book
        </button>
      </div>
    </header>
    <main class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6">
      <section class="md:col-span-2">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex flex-col">
            <label for="search-input" class="mb-1 font-medium text-dark-bleu"
              >Search</label
            >
            <input
              id="search-input"
              name="search-input"
              type="text"
              class="w-full rounded border px-3 py-2 bg-white"
              placeholder="Search by title or author"
            />
          </div>
          <div class="flex flex-col">
            <label for="sort-input" class="mb-1 font-medium text-dark-bleu"
              >Sort by</label
            >
            <select
              id="sort-input"
              name="sort-input"
              class="mt-1 w-full rounded border px-3 py-2 bg-white"
            >
              <option value="title">Titre</option>
              <option value="author">Auteur</option>
              <option value="year">Année</option>
            </select>
          </div>
        </div>
        <div
          id="books-list"
          class="mt-6 grid grid-cols-2 md:grid-cols-3 gap-4"
        ></div>
      </section>
      <section class="md:col-span-1 bg-white rounded-lg border p-5">
        <h2 class="text-xl font-bold text-dark-bleu mb-5">Add a book</h2>

        <form id="add-book-form" class="flex flex-col gap-4">
          <div>
            <label for="book-title" class="block font-medium text-dark-bleu">
              Title *
            </label>
            <input
              id="book-title"
              name="title"
              type="text"
              required
              class="mt-1 w-full rounded border px-3 py-2"
              placeholder="Book title"
            />
          </div>

          <div>
            <label for="book-author" class="block font-medium text-dark-bleu">
              Author *
            </label>
            <input
              id="book-author"
              name="author"
              type="text"
              required
              class="mt-1 w-full rounded border px-3 py-2"
              placeholder="Author name"
            />
          </div>

          <div>
            <label for="book-year" class="block font-medium text-dark-bleu">
              Publication year
            </label>
            <input
              id="book-year"
              name="year"
              type="number"
              min="0"
              max="9999"
              class="mt-1 w-full rounded border px-3 py-2"
              placeholder="e.g. 2024"
            />
          </div>

          <div>
            <label for="book-genre" class="block font-medium text-dark-bleu">
              Genre
            </label>
            <input
              id="book-genre"
              name="genre"
              type="text"
              class="mt-1 w-full rounded border px-3 py-2"
              placeholder="e.g. Fantasy"
            />
          </div>

          <div>
            <label
              for="book-description"
              class="block font-medium text-dark-bleu"
            >
              Description
            </label>
            <textarea
              id="book-description"
              name="description"
              rows="3"
              class="mt-1 w-full rounded border px-3 py-2"
              placeholder="A short description..."
            ></textarea>
          </div>

          <div>
            <label for="book-status" class="block font-medium text-dark-bleu">
              Reading status
            </label>
            <select
              id="book-status"
              name="status"
              required
              class="mt-1 w-full rounded border px-3 py-2 bg-white"
            >
              <option value="to-read">To read</option>
              <option value="reading">Currently reading</option>
              <option value="read">Read</option>
            </select>
          </div>

          <button
            type="submit"
            class="w-full rounded bg-dark-bleu text-white py-2 px-4"
          >
            + Add book
          </button>
        </form>
      </section>
    </main>
    <footer>
      <script type="module" src="js/app.js"></script>
    </footer>
  </body>
</html>
